{% load static %}<!doctype html>
<html lang="en-GB" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · School Timetable</title>
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <img class="brand-logo" src="{% static 'img/logo-96.png' %}" srcset="{% static 'img/logo-96.png' %} 1x, {% static 'img/logo-192.png' %} 2x" width="48" height="48" alt="">
      <span class="brand-name">School Timetable</span>
    </div>
    <h1>Sign in</h1>
    {% if form.non_field_errors %}
    <div class="alert alert-error" role="alert">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
    {% endif %}
    <form method="post" class="stack">
      {% csrf_token %}
      <div class="field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </main>
</body>
</html>
