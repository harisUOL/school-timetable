{% load static %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · School Timetable</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">TT</span>
      <span class="brand-name">School Timetable</span>
    </div>
    <h1>Sign in</h1>
    {% if form.non_field_errors %}
    <div class="alert alert-error" role="alert">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
    {% endif %}
    <form method="post" class="stack">
      {% csrf_token %}
      <div class="field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </main>
</body>
</html>
